<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Farmbot Interpreter</title>
  <script src="acorn.js"></script>
  <script src="acorn_interpreter.js"></script>
  <!-- <script src="./node_modules/acorn/dist/acorn.js"></script> -->
  <script src="blockly_compressed.js"></script>
  <script src="en.js"></script>
  <style>
	@font-face {
		font-family: StardewFont;
		src: url(font/Stardew_Valley.ttf);
	}
  
    html {
      height: 100%;
    }
    body {
      background-color: #ffd284;
      font-family: sans-serif;
      height: 100%;
      margin: 0;
	  font-family: StardewFont !important;
    }
	
	body * { 
		font-family: StardewFont;
		color: #571007;
		font-size: 20px;
	}
	
    h1 {
      font-weight: normal;
      font-size: 140%;
    }
	
	#container {
		width: 100%;
		height: 100%;
	}
	
    #test-button {
		position: fixed;
		z-index: 30;
		top: 25px;
		right: 65px;
		width: 6em;
		height: 80px;
		border: none;
	    font-size: 28px;
		background: url(images/ButtonBackground.png);
		background-size: cover;
		transition: all .2s;
    }
	
	#test-button:hover {
		background-color: rgba(173,100,0,0.3);
		background-blend-mode: multiply;
		transform: scale(1.02);
	}
	
	#test-button:active {
		background-color: rgba(173,100,0,0.1);
		background-blend-mode: multiply;
		transition: unset;
	}
	
	button#exit {
		width: 44px;
		height: 44px;
		position: fixed;
		background: url(images/CloseButton.png);
		top: 10px;
		right: 10px;
		border: none;
	}

	button#exit:hover {
		transform: scale(1.03);
		filter: brightness(0.9);
	}

	button#exit:active {
		transform: unset;
		filter: unset;
	}
	
	svg.blocklySvg {
		background-color: #ffd284;
		box-sizing: border-box;
	}
	
	.blocklyToolboxDiv.blocklyNonSelectable {
		background-color: #ffd284;
		padding: 30px;
		box-sizing: border-box;
	}
	
	svg.blocklyFlyout {
		transform: translate(155px, 0px) !important;
		border-width: 0px 0px 2px;
		padding: 20px;
	}
	
	path.blocklyFlyoutBackground {
		fill: #ffd284;
	}
	
	.blocklyTreeSeparator {
		border-bottom: solid #b75405 1px;
	}
	
	.blocklyScrollbarHandle {
		fill: #b75405;
	}
	
	#explanation {
		position: fixed;
		display: none;
		bottom: 0;
		left: 155px;
		right: 100px;
		background: white;
		z-index: 100;
		font-size: 28px;
	}
	
	#explanation * {
		font-size: 26px;
	}


	
	div#explanationHeader, 
	div#explanationPanel {
		background: #ffd284;
		padding: 25px;
	}
	
	div#headerWrapper {
		display: block;
		position: relative;
		padding-right: 45px;
	}
	
	div#headerWrapper:after {
		content: '';
		position: absolute;
		right: 0;
		top: 0;
		bottom: 0;
		width: 45px;
		height: 25px;
		background: url(images/DownArrow.png);
		transform: scale(.5);
		transition: transform .2s;
	}
	
	div#headerWrapper.flipArrow:after {
		transform: scale(.5) rotate(-180deg);
	}
	
	#explanationPanel {
		display: none;
		margin-top: -20px;
	}
	
	.display {
		display: block !important;
	}
	
	.blocklyDropDownDiv.geras-renderer.classic-theme * {
		font-size: 18px;
	}
	
	div#explanationHeader, 
	div#explanationPanel, 
	svg.blocklyFlyout, 
	.blocklyToolboxDiv.blocklyNonSelectable, 
	svg.blocklySvg
	
	{
		border-image: url(images/BorderBox.png);
		border-image-slice: 44;
		border-image-width: 28px;
		border-style: solid;
	}
	
	#panelButtons {
		height: 50px;
	}
	
	.explanationButtons {
		width: 48px;
		height: 44px;
		background: url(images/stardewArrows.png);
		background-size: cover;
		display: none;
		transition: transform .05s;
	}
	
	.explanationButtons:hover {
		transform: scale(1.05);
	}
	
	.explanationButtons:active {
		transform: scale(1);
		transition: unset;
	}
	
	#explanationLeft {
		float: left;
	}
	
	#explanationRight {
		background-position-x: 48px;
		float: right;
	}
  </style>
</head>
<body>
  <div id="container" style="width: 100%; height: 100%">
    <div id="blocklyDiv" style="height: 100%; width: 100%"></div>
    <button id="test-button" onclick="testCode()">Test My Code</button>
	<button id="exit" onclick="closeIDE()"></button
  </div>

  <xml id="toolbox" style="display: none">
    <category id="catLogic" colour="210" name="Logic">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
    </category>
    <category id="catLoops" colour="120" name="Loops">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
        <value name="BY">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="controls_forEach"></block>
      <block type="controls_flow_statements"></block>
    </category>
    <category id="catMath" colour="230" name="Math">
      <block type="math_number"></block>
      <block type="math_arithmetic">
        <value name="A">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="B">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="math_single">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">9</field>
          </shadow>
        </value>
      </block>
      <block type="math_trig">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">45</field>
          </shadow>
        </value>
      </block>
      <block type="math_constant"></block>
      <block type="math_number_property">
        <value name="NUMBER_TO_CHECK">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="math_change">
        <value name="DELTA">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="math_round">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">3.1</field>
          </shadow>
        </value>
      </block>
      <block type="math_on_list"></block>
      <block type="math_modulo">
        <value name="DIVIDEND">
          <shadow type="math_number">
            <field name="NUM">64</field>
          </shadow>
        </value>
        <value name="DIVISOR">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="math_constrain">
        <value name="VALUE">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="LOW">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="HIGH">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_int">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_float"></block>
    </category>
    <category id="catText" colour="160" name="Text">
      <block type="text"></block>
      <block type="text_join"></block>
      <block type="text_append">
        <value name="TEXT">
          <shadow type="text"></shadow>
        </value>
      </block>
      <block type="text_length">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_isEmpty">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT"></field>
          </shadow>
        </value>
      </block>
      <block type="text_indexOf">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
        <value name="FIND">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_charAt">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_getSubstring">
        <value name="STRING">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_changeCase">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_trim">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_print">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_prompt_ext">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
    </category>
    <category id="catLists" colour="260" name="Lists">
      <block type="lists_create_with">
        <mutation items="0"></mutation>
      </block>
      <block type="lists_create_with"></block>
      <block type="lists_repeat">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">5</field>
          </shadow>
        </value>
      </block>
      <block type="lists_length"></block>
      <block type="lists_isEmpty"></block>
      <block type="lists_indexOf">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">list</field>
          </block>
        </value>
      </block>
      <block type="lists_getIndex">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">list</field>
          </block>
        </value>
      </block>
      <block type="lists_setIndex">
        <value name="LIST">
          <block type="variables_get">
            <field name="VAR">list</field>
          </block>
        </value>
      </block>
      <block type="lists_getSublist">
        <value name="LIST">
          <block type="variables_get">
            <field name="VAR">list</field>
          </block>
        </value>
      </block>
      <block type="lists_split">
        <value name="DELIM">
          <shadow type="text">
            <field name="TEXT">,</field>
          </shadow>
        </value>
      </block>
      <block type="lists_sort"></block>
    </category>
    <category id="catColour" colour="20" name="Color">
      <block type="colour_picker"></block>
      <block type="colour_random"></block>
      <block type="colour_rgb">
        <value name="RED">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
        <value name="GREEN">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="BLUE">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="colour_blend">
        <value name="COLOUR1">
          <shadow type="colour_picker">
            <field name="COLOUR">#ff0000</field>
          </shadow>
        </value>
        <value name="COLOUR2">
          <shadow type="colour_picker">
            <field name="COLOUR">#3333ff</field>
          </shadow>
        </value>
        <value name="RATIO">
          <shadow type="math_number">
            <field name="NUM">0.5</field>
          </shadow>
        </value>
      </block>
    </category>
    <sep></sep>
    <category id="catVariables" colour="330" custom="VARIABLE" name="Variables"></category>
    <category id="catFunctions" colour="290" custom="PROCEDURE" name="Functions"></category>
	<sep></sep>
  </xml>

  <xml xmlns="https://developers.google.com/blockly/xml" id="startBlocks" style="display: none">
    <!-- <block type="OnClick">
      <next>
        <block type="MoveForward">
        </block>
      </next>
    </block> -->

  </xml>
  
  <div id="explanation">
	<div id="explanationHeader">
		<div id="headerWrapper"></div>
	</div>
	<div id="explanationPanel">
		<div id="panelWrapper"></div>
		<div id="panelButtons">
			<div id="explanationLeft" class="explanationButtons"></div>
			<div id="explanationRight" class="explanationButtons"></div>
		</div>
	</div>
  </div>

  <script src="./blocks_compressed.js"></script>
  <script src="./javascript_compressed.js"></script>
  <!-- <script src="./blockly.min"></script> -->
  <script src="./websocket.js"></script>
  <script src="./target.js"></script>
  <script src="./thread.js"></script>
  <script src="./blocky_constructor.js"></script>
  <script src="./custom-dialog.js"></script>

  <script type="text/javascript">
    function testCode() {
      if (!window.socket || window.socket.readyState > 1) return;
      console.log("Test!");
      window.socket.send(JSON.stringify({
        type: 'test',
        data: null,
      }));
    }

    document.onkeydown = function(e) {
      console.log(document.activeElement);
      if (e.code === 'KeyX') {
		closeIDE();
      }
    }
	
	function closeIDE() {
		console.log("Working");
		if (!window.socket || window.socket.readyState > 1) return;
		window.socket.send(JSON.stringify({
          type: 'minimize',
          data: null,
        }));
	}
	
	document.getElementById("explanationHeader").onclick = function(e) {
		if(explanation.length > 0) {
			document.getElementById("explanationPanel").classList.toggle("display");
			document.getElementById("headerWrapper").classList.toggle("flipArrow");
		}
	}
	
	document.getElementById("explanationLeft").onclick = function(e) {
		document.getElementById("explanationRight").classList.add("display");
		explanationPage--;
		document.getElementById("panelWrapper").innerHTML = explanation[explanationPage];
		
		if(explanationPage == 0) {
			document.getElementById("explanationLeft").classList.remove("display");
		}
	}
	
	document.getElementById("explanationRight").onclick = function(e) {
		document.getElementById("explanationLeft").classList.add("display");
		explanationPage++;
		document.getElementById("panelWrapper").innerHTML = explanation[explanationPage];
	
		if(explanationPage == explanation.length - 1) {
			document.getElementById("explanationRight").classList.remove("display");
		}
	}
	
	<!-- document.getElementsByClassName("blocklyTrash")[0].setAttribute("transform", "translate(1242,720)"); -->
	<!-- document.getElementById("explanationHeader").addEventListener('click', explanationClick, false); -->
  </script>
</body>
</html>
